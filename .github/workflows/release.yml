name: Release

# Chay khi push tag dang v1.0.0, v1.2.3 ...
# Build file .exe Windows bang PyInstaller va dinh kem vao GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
          YOLO_AUTOINSTALL: "false"
        run: pytest -q

      - name: Build with PyInstaller
        run: pyinstaller AutoLabelStudioAI.spec --noconfirm --clean

      # Chan phat hanh neu DLL runtime MSVC o goc bundle khong phai ban moi nhat (BUG-07)
      - name: Check bundle (runtime DLLs)
        run: python packaging/check_bundle.py

      - name: Self-test packaged exe (headless)
        env:
          ALS_SELFTEST_NOGUI: "1"
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'als_sandbox'
          $p = Start-Process -FilePath '.\dist\AutoLabelStudioAI\AutoLabelStudioAI.exe' -ArgumentList '--selftest' -Wait -PassThru
          $report = Join-Path $env:LOCALAPPDATA 'AutoLabelStudioAI\logs\selftest-report.txt'
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { Write-Error "selftest exit $($p.ExitCode)"; exit 1 }

      - name: Package zip with docs
        run: python packaging/make_package.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLabelStudioAI-windows-x64
          path: dist/AutoLabelStudioAI-v*-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoLabelStudioAI-v*-windows-x64.zip
          generate_release_notes: true
