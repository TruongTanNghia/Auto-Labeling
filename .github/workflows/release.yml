name: Release

# Chay khi push tag dang v1.0.0, v1.2.3 ...
# Build file .exe Windows bang PyInstaller va dinh kem vao GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
          YOLO_AUTOINSTALL: "false"
        run: python tests/test_pipeline.py

      - name: Build with PyInstaller
        run: pyinstaller AutoLabelStudioAI.spec --noconfirm

      - name: Zip build output
        run: Compress-Archive -Path dist/AutoLabelStudioAI -DestinationPath AutoLabelStudioAI-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLabelStudioAI-windows-x64
          path: AutoLabelStudioAI-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoLabelStudioAI-windows-x64.zip
          generate_release_notes: true
